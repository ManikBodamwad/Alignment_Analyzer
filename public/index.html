  <style>
    /* Reset & Base Typography */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --apple-border-subtle: rgba(0, 0, 0, 0.04);
      --apple-success: #34c759;
      --apple-warning: #ff9500;
      --apple-danger: #ff3b30;
      --apple-purple: #af52de;
      --apple-cyan: #2997ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--apple-bg);
      color: var(--apple-text);

      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { text-decoration: none; color: inherit; }
    table { width: 100%; border-collapse: collapse; }

    /* Custom Apple Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 980px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.28); }

    /* =========================================================================
       LIVING ANIMATED MESH GRADIENT BACKGROUND
       ========================================================================= */
    .apple-mesh-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #fbfbfd;
    }
    .apple-mesh-orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
      mix-blend-mode: multiply;
    }
    .apple-mesh-orb-1 {
      top: -15%;
      left: 10%;
      width: 70vw;
      height: 70vw;
      max-width: 900px;
      max-height: 900px;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.18) 0%, rgba(41, 151, 255, 0.08) 45%, transparent 70%);
      filter: blur(85px);
      animation: appleMeshFloat1 24s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .apple-mesh-orb-2 {
      top: 30%;
      right: -8%;
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;
      background: radial-gradient(circle, rgba(175, 82, 222, 0.16) 0%, rgba(88, 86, 214, 0.06) 50%, transparent 70%);
      filter: blur(95px);
      animation: appleMeshFloat2 28s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .apple-mesh-orb-3 {
      bottom: -15%;
      left: 25%;
      width: 75vw;
      height: 75vw;
      max-width: 950px;
      max-height: 950px;
      background: radial-gradient(circle, rgba(52, 199, 89, 0.14) 0%, rgba(41, 151, 255, 0.06) 50%, transparent 70%);
      filter: blur(90px);
      animation: appleMeshFloat3 26s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .apple-mesh-orb-4 {
      top: 15%;
      right: 30%;
      width: 55vw;
      height: 55vw;
      max-width: 700px;
      max-height: 700px;
      background: radial-gradient(circle, rgba(255, 149, 0, 0.11) 0%, rgba(255, 45, 85, 0.05) 50%, transparent 70%);
      filter: blur(80px);
      animation: appleMeshFloat4 22s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }
    .apple-mesh-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.8;
    }

    @keyframes appleMeshFloat1 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(12%, 14%, 0) scale(1.12) rotate(45deg); }
      100% { transform: translate3d(-10%, 22%, 0) scale(0.94) rotate(90deg); }
    }
    @keyframes appleMeshFloat2 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(-16%, -12%, 0) scale(1.08) rotate(-40deg); }
      100% { transform: translate3d(-8%, 15%, 0) scale(0.96) rotate(-80deg); }
    }
    @keyframes appleMeshFloat3 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(18%, -10%, 0) scale(1.14) rotate(35deg); }
      100% { transform: translate3d(4%, -20%, 0) scale(0.92) rotate(70deg); }
    }
    @keyframes appleMeshFloat4 {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      50% { transform: translate3d(-14%, 20%, 0) scale(1.1) rotate(-30deg); }
      100% { transform: translate3d(10%, 8%, 0) scale(0.95) rotate(-60deg); }
    }

    /* =========================================================================
       APPLE CARDS, FROSTED GLASS & SURFACE TOKENS
       ========================================================================= */
    .glass-card, .apple-card {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover, .apple-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px -4px rgba(0, 113, 227, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 113, 227, 0.3);
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* =========================================================================
       APPLE PILL BUTTONS & CONTROLS
       ========================================================================= */
    .apple-btn-primary {
      background-color: var(--apple-accent);
      color: #ffffff;
      border: 1px solid transparent;
      border-radius: 980px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 2px 10px rgba(0, 113, 227, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .apple-btn-primary:hover {
      background-color: var(--apple-accent-hover);
      box-shadow: 0 4px 16px rgba(0, 113, 227, 0.35);
      transform: scale(1.02);
    }
    .apple-btn-primary:active {
      transform: scale(0.98);
    }
    .apple-btn-secondary {
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--apple-text);
      border: 1px solid #d2d2d7;
      border-radius: 980px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .apple-btn-secondary:hover {
      background-color: #ffffff;
      border-color: var(--apple-accent);
      color: var(--apple-accent);
      transform: scale(1.02);
    }
    .apple-btn-secondary:active {
      transform: scale(0.98);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }

    .animate-fade-in {
      animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .card-hover {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 113, 227, 0.35) !important;
      box-shadow: 0 16px 36px -4px rgba(0, 113, 227, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* Shimmer Button */
    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    .btn-shimmer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: skewX(-20deg) translateX(-150%);
      animation: shimmerBeam 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmerBeam {
      0% { transform: skewX(-20deg) translateX(-150%); }
      100% { transform: skewX(-20deg) translateX(250%); }
    }

    /* Layout & Utilities */

    /* Grid Columns */
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
