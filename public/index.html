<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Alignment Analyzer | Organizational Diagnostic Intelligence</title>

  <!-- Inline Vector Favicon matching Brand Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%230071e3'/%3E%3Cstop offset='55%25' stop-color='%232997ff'/%3E%3Cstop offset='100%25' stop-color='%235856d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cellipse cx='24' cy='24' rx='15' ry='6.5' fill='none' stroke='white' stroke-width='2' transform='rotate(30 24 24)' opacity='0.9'/%3E%3Cellipse cx='24' cy='24' rx='15' ry='6.5' fill='none' stroke='white' stroke-width='2' transform='rotate(-30 24 24)' opacity='0.9'/%3E%3Ccircle cx='24' cy='24' r='3.5' fill='white'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS v3 CDN for full responsive grid, flex, spacing & typography coverage -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Apple SF Pro Fallback & Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --apple-bg: #f5f5f7;
      --apple-surface: #ffffff;
      --apple-text: #1d1d1f;
      --apple-text-secondary: #515154;
      --apple-text-muted: #86868b;
      --apple-accent: #0071e3;
      --apple-accent-hover: #0077ed;
      --apple-accent-light: rgba(0, 113, 227, 0.08);
      --apple-border: rgba(0, 0, 0, 0.08);
      --apple-success: #34c759;
      --apple-warning: #ff9500;
      --apple-danger: #ff3b30;
      --apple-purple: #5856d6;
      --apple-cyan: #2997ff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: var(--apple-bg);
      color: var(--apple-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-mono {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Custom Apple Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.16); border-radius: 980px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.30); }

    /* =========================================================================
       LIVING APPLE AURORA MESH GRADIENT BACKGROUND
       ========================================================================= */
    .apple-mesh-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: linear-gradient(135deg, #f7f8fc 0%, #f2f5fb 50%, #f5f5f7 100%);
    }

    .apple-mesh-orb {
      position: absolute;
      border-radius: 50%;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .apple-mesh-orb-1 {
      top: -18%;
      left: 6%;
      width: 65vw;
      height: 65vw;
      max-width: 920px;
      max-height: 920px;
      background: radial-gradient(circle, rgba(0, 113, 227, 0.28) 0%, rgba(41, 151, 255, 0.14) 42%, transparent 72%);
      filter: blur(72px);
      animation: appleMeshFloat1 18s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .apple-mesh-orb-2 {
      top: 18%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      max-width: 840px;
      max-height: 840px;
      background: radial-gradient(circle, rgba(88, 86, 214, 0.24) 0%, rgba(175, 82, 222, 0.11) 45%, transparent 72%);
      filter: blur(80px);
      animation: appleMeshFloat2 22s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .apple-mesh-orb-3 {
      bottom: -20%;
      left: 22%;
      width: 68vw;
      height: 68vw;
      max-width: 940px;
      max-height: 940px;
      background: radial-gradient(circle, rgba(41, 151, 255, 0.22) 0%, rgba(52, 199, 89, 0.12) 48%, transparent 72%);
      filter: blur(76px);
      animation: appleMeshFloat3 20s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .apple-mesh-orb-4 {
      top: 40%;
      left: -8%;
      width: 48vw;
      height: 48vw;
      max-width: 680px;
      max-height: 680px;
      background: radial-gradient(circle, rgba(52, 199, 89, 0.16) 0%, rgba(0, 199, 190, 0.10) 48%, transparent 72%);
      filter: blur(70px);
      animation: appleMeshFloat4 16s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .apple-mesh-ribbon {
      position: absolute;
      top: -30%;
      left: -20%;
      width: 140%;
      height: 160%;
      background: conic-gradient(
        from 120deg at 50% 50%,
        rgba(0, 113, 227, 0.05) 0deg,
        rgba(88, 86, 214, 0.06) 90deg,
        rgba(41, 151, 255, 0.04) 180deg,
        rgba(52, 199, 89, 0.05) 270deg,
        rgba(0, 113, 227, 0.05) 360deg
      );
      animation: ribbonRotate 45s linear infinite;
      opacity: 0.9;
    }

    .apple-mesh-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(29, 29, 31, 0.045) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.75;
    }

    @keyframes appleMeshFloat1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14%, 12%, 0) scale(1.12); }
      100% { transform: translate3d(-8%, 22%, 0) scale(0.95); }
    }
    @keyframes appleMeshFloat2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-16%, -10%, 0) scale(1.09); }
      100% { transform: translate3d(-6%, 18%, 0) scale(0.96); }
    }
    @keyframes appleMeshFloat3 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(16%, -12%, 0) scale(1.14); }
      100% { transform: translate3d(-6%, -22%, 0) scale(0.92); }
    }
    @keyframes appleMeshFloat4 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(18%, -14%, 0) scale(1.10); }
      100% { transform: translate3d(6%, 14%, 0) scale(0.94); }
    }
    @keyframes ribbonRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* =========================================================================
       APPLE CARDS, FROSTED GLASS & SURFACES
       ========================================================================= */
    .glass-card, .apple-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      color: var(--apple-text);
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.32s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover, .apple-card:hover {
      box-shadow: 0 14px 34px -6px rgba(0, 113, 227, 0.11), 0 2px 8px rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 113, 227, 0.24);
    }

    .card-hover {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px -6px rgba(0, 113, 227, 0.14), 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    /* =========================================================================
       APPLE PILL BUTTONS
       ========================================================================= */
    .apple-btn-primary {
      background: linear-gradient(135deg, #0071e3 0%, #0077ed 100%);
      color: #ffffff !important;
      border: 1px solid transparent;
      border-radius: 980px;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0, 113, 227, 0.28);
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .apple-btn-primary:hover {
      background: linear-gradient(135deg, #0077ed 0%, #2997ff 100%);
      box-shadow: 0 6px 20px rgba(0, 113, 227, 0.38);
      transform: translateY(-1px) scale(1.015);
    }
    .apple-btn-primary:active {
      transform: scale(0.98);
    }
    .apple-btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .apple-btn-secondary {
      background-color: rgba(255, 255, 255, 0.92);
      color: #1d1d1f !important;
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 980px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
    }
    .apple-btn-secondary:hover {
      background-color: #ffffff;
      border-color: #0071e3;
      color: #0071e3 !important;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.12);
      transform: translateY(-1px) scale(1.015);
    }
    .apple-btn-secondary:active {
      transform: scale(0.98);
    }

    /* =========================================================================
       PREMIUM MOTION CHOREOGRAPHY
       ========================================================================= */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translate3d(0, 14px, 0) scale(0.992);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .animate-fade-in {
      animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .stagger-1 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both; }
    .stagger-2 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.09s both; }
    .stagger-3 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both; }
    .stagger-4 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.19s both; }
    .stagger-5 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
    .stagger-6 { animation: fadeSlideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.29s both; }

    @keyframes barReveal {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
    .bar-grow {
      transform-origin: left center;
      animation: barReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }

    @keyframes dashFlow {
      to {
        stroke-dashoffset: -24;
      }
    }
    .animate-dash-flow {
      stroke-dasharray: 7 5;
      animation: dashFlow 1.2s linear infinite;
    }

    @keyframes logoOrbitSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-logo-orbit {
      transform-origin: 24px 24px;
      animation: logoOrbitSlow 22s linear infinite;
    }

    @keyframes radarRing {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.65); opacity: 0; }
      100% { transform: scale(1.65); opacity: 0; }
    }
    .live-dot {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .live-dot::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 9999px;
      background: currentColor;
      opacity: 0.4;
      animation: radarRing 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    /* Shimmer Highlight for Primary Action */
    .btn-shimmer {
      position: relative;
      overflow: hidden;
    }
    .btn-shimmer::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
      transform: skewX(-20deg) translateX(-160%);
      animation: shimmerBeam 4.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes shimmerBeam {
      0% { transform: skewX(-20deg) translateX(-160%); }
      55% { transform: skewX(-20deg) translateX(280%); }
      100% { transform: skewX(-20deg) translateX(280%); }
    }
  </style>
</head>
<body>
  <!-- Apple Living Animated Mesh Gradient Canvas -->
  <div class="apple-mesh-backdrop">
    <div class="apple-mesh-ribbon"></div>
    <div class="apple-mesh-orb apple-mesh-orb-1"></div>
    <div class="apple-mesh-orb apple-mesh-orb-2"></div>
    <div class="apple-mesh-orb apple-mesh-orb-3"></div>
    <div class="apple-mesh-orb apple-mesh-orb-4"></div>
    <div class="apple-mesh-overlay"></div>
  </div>

  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#1d1d1f;background:transparent;position:relative;z-index:10;">
      <div style="text-align:center;padding:40px;background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);border-radius:24px;border:1px solid rgba(0,0,0,0.08);box-shadow:0 12px 32px rgba(0,0,0,0.06);">
        <div style="width:36px;height:36px;border:3px solid #0071e3;border-top-color:transparent;border-radius:50%;margin:0 auto 16px;animation:spin 0.9s linear infinite;"></div>
        <h2 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin-bottom:8px;">Initializing Diagnostic Engine</h2>
        <p style="font-size:14px;color:#86868b;">Loading verified evidence, stakeholder models, and organizational dimensions...</p>
      </div>
    </div>
  </div>

  <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
  <script src="/bundle.js?v=20261113_apple_02"></script>
</body>
</html>
